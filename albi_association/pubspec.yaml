name: qafeel
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  image_picker: ^1.1.2
  intl: ^0.19.0
  device_preview: ^1.2.0
  mime: ^2.0.0
  url_launcher: ^6.3.1
  flutter_typeahead: ^3.1.3
  http_parser: ^4.1.2
  modal_progress_hud_nsn: ^0.5.1
  shimmer: ^3.0.0
  package_info_plus: ^8.0.0
  cached_network_image: ^3.4.1
  get_it: ^8.0.3
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.2.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  flutter_localization: ^0.3.2
  pretty_dio_logger: ^1.4.0
  firebase_core: ^3.14.0
  upgrader: ^11.4.0
  smooth_page_indicator: ^1.2.1
  pinput: ^5.0.1
  bloc: ^9.0.0
  flutter_svg: ^2.2.0
  dartz: ^0.10.1
  path: ^1.9.0
  permission_handler: ^12.0.1
  html: ^0.15.6
  html_unescape: ^2.0.0
  pin_code_fields: ^8.0.1
  curved_navigation_bar: ^1.0.6
  curved_labeled_navigation_bar: ^2.0.5
  carousel_slider: ^5.1.1
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  geocoding: ^4.0.0
  http: ^1.5.0
  palette_generator: ^0.3.3+7
  flutter_launcher_icons: ^0.14.4
  pusher_channels_flutter: ^2.2.0
  video_player: ^2.10.0

  # Payment Dependencies from your old project
  nearpay_flutter_sdk:
    git:
      url: https://github.com/nearpayio/nearpay-flutter-sdk.git
      ref: v1
  fluttertoast: ^8.2.10
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  lottie: ^3.3.1
  sizer: ^3.1.3
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/png/
    - assets/images/svg/
    - assets/images/svg/nav/
    - assets/images/animations/
    - assets/translations/en.json
    - assets/translations/ar.json

  fonts:
    - family: english
      fonts:
        - asset: assets/fonts/en/fonnts.com-Mont_Blanc_Bold_Italic.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Blanc_ExtraBold.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Blanc_ExtraLight.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Blanc_Regular_Italic.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Blanc_Thin_Italic.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Bold.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_ExtraLight_DEMO.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Heavy_DEMO.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Regular.ttf
        - asset: assets/fonts/en/fonnts.com-Mont_Thin.ttf
          style: italic

    - family: arabic
      fonts:
        - asset: assets/fonts/ar/GE_SS_Two_Bold.otf
        - asset: assets/fonts/ar/alfont_com_AlFont_com_GE_SS_TWO_MEDIUM.otf
        - asset: assets/fonts/ar/alfont_com_AlFont_com_GE_SS_Two_Light-1-1.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/png/about.png
  adaptive_icon_foreground: assets/images/png/about.png
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21
  remove_alpha_ios: true
